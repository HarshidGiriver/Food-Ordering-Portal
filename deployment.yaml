
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      track: blue
  template:
    metadata:
      labels:
        app: food-portal
        track: blue
    spec:
      containers:
        - name: food-container
          image: harshid2007/food-ordering-portal:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      track: green
  template:
    metadata:
      labels:
        app: food-portal
        track: green
    spec:
      containers:
        - name: food-container
          image: harshid2007/food-ordering-portal:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: food-portal-service
spec:
  type: NodePort
  selector:
    app: food-portal
    track: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: food-green-test
spec:
  type: ClusterIP
  selector:
    app: food-portal
    track: green
  ports:
    - port: 80
      targetPort: 80
